<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digit Canvas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Draw a digit</h1>
    <p class="subtitle">28 &times; 28 grid, sent to your backend on submit</p>

    <canvas id="grid" width="280" height="280"></canvas>

    <div class="controls">
      <button id="clearBtn" class="btn btn-ghost">Clear</button>
      <button id="submitBtn" class="btn btn-primary">Submit</button>
    </div>

    <p id="status" class="status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
